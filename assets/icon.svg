<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0533"/>
      <stop offset="60%" style="stop-color:#3B0A72"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Subtle noise texture overlay -->
  <rect width="1024" height="1024" rx="220" fill="#7C3AED" opacity="0.04"/>

  <!-- Outer ring (3/4 arc) -->
  <circle cx="512" cy="512" r="360" fill="none" stroke="url(#ringGrad)" stroke-width="28" stroke-linecap="round"
    stroke-dasharray="1885" stroke-dashoffset="471"
    transform="rotate(-135 512 512)"
    filter="url(#glow)"/>

  <!-- Inner ring tick marks -->
  <g stroke="#A78BFA" stroke-width="12" opacity="0.4">
    <line x1="512" y1="192" x2="512" y2="228" transform="rotate(0 512 512)"/>
    <line x1="512" y1="192" x2="512" y2="218" transform="rotate(30 512 512)"/>
    <line x1="512" y1="192" x2="512" y2="218" transform="rotate(60 512 512)"/>
    <line x1="512" y1="192" x2="512" y2="228" transform="rotate(90 512 512)"/>
    <line x1="512" y1="192" x2="512" y2="218" transform="rotate(120 512 512)"/>
    <line x1="512" y1="192" x2="512" y2="218" transform="rotate(150 512 512)"/>
    <line x1="512" y1="192" x2="512" y2="228" transform="rotate(180 512 512)"/>
    <line x1="512" y1="192" x2="512" y2="218" transform="rotate(210 512 512)"/>
    <line x1="512" y1="192" x2="512" y2="218" transform="rotate(240 512 512)"/>
    <line x1="512" y1="192" x2="512" y2="228" transform="rotate(270 512 512)"/>
    <line x1="512" y1="192" x2="512" y2="218" transform="rotate(300 512 512)"/>
    <line x1="512" y1="192" x2="512" y2="218" transform="rotate(330 512 512)"/>
  </g>

  <!-- Lightning bolt (center, pointing up-right) -->
  <polygon
    points="490,280  440,530  510,510  460,760  590,470  510,490  570,280"
    fill="#A78BFA"
    filter="url(#softglow)"
  />
  <!-- Bright core of bolt -->
  <polygon
    points="496,310  454,510  514,496  468,720  578,484  512,498  556,310"
    fill="#E0D7FF"
    opacity="0.9"
  />

  <!-- Center glow dot -->
  <circle cx="512" cy="512" r="18" fill="#7C3AED" opacity="0.6" filter="url(#glow)"/>

  <!-- Arc endpoint dot (progress end indicator) -->
  <circle cx="258" cy="766" r="18" fill="#A78BFA" filter="url(#glow)" opacity="0.8"/>
</svg>
